# ==========================================================
# moonspace 2.0 Domain TOML —— VibeSpace 行为文件（转移表）
#
# 相位环（write→check→fix）：Drafting --ActDone--> Checking；
# Checking --CheckFailed--> Fixing --ActDone--> Checking（验证-修复环，
# agent_space Thinking⇄ToolCalling 同款——环在状态图不走 feedback
# router）；Checking --CheckGreen--> Answered（吸收）。
# 跨事件携带：CheckFailed{reason} → Fixing 行 effect LLMAct
# args=["reason"]（reason 喂修复指令——args 按名投影事件 payload）。
# ==========================================================

[meta]
schema_version = "2.0"
name = "vibe_space"
dialect = "moonspace"
prefix = "Vibe"

# ---- 起步（装填行）----
[[space.transitions]]
from = "Idle"
on = "TaskReady"
to = "Drafting"
effect = "LLMAct"
args = ["goal"]
assign = ["goal"]

# ---- 起草完成 → 验证 ----
[[space.transitions]]
from = "Drafting"
on = "ActDone"
to = "Checking"
effect = "ShellCheck"

# ---- 验证-修复环 ----
[[space.transitions]]
from = "Checking"
on = "CheckFailed"
to = "Fixing"
effect = "LLMAct"
args = ["reason"]
assign = ["check_reason"]
assign_from = [{ slot = "check_reason", from_field = "reason" }]

[[space.transitions]]
from = "Fixing"
on = "ActDone"
to = "Checking"
effect = "ShellCheck"

# ---- 绿 → 吸收 ----
[[space.transitions]]
from = "Checking"
on = "CheckGreen"
to = "Answered"
assign = ["result_summary"]
assign_from = [{ slot = "result_summary", from_field = "note" }]

# ---- 不变量声明 ----
[[space.invariants]]
name = "answered_absorbing"
doc = "Answered 是吸收态：出边必须为零（Completed 出口）"

[[space.invariants]]
name = "green_only_from_checking"
doc = "CheckGreen 只从 Checking 出发——没 check 绿不算完成（相位纪律）"

# ---- 格子方言（格1 拍定，cell.md §9）----
# ShellCheck 结果摘要格：第一个 JSON 契约格——判定面，机器消费
# （契约判据：机器消费面一型 JSONL，人话面自由文本）。
# form=jsonl（B 拍结果格默认）；error_event ∈ 阳事件集（D 拍，合同门查）。
# fields：exit_code=check 退出码；error_count=错误文本非空行数（绿=0）；
# first_error=错误文本首个非空行（截 200，绿=""）。
# 注：gen 解析面暂不读 cell 键（持久合同——未知键忽略），消费位 =
# moonxllm/cmd vibe_assembly 手写摘要（①CellHandler 路线格3 前拍）。
[[space.cell]]
name = "shell_check_summary"
effect = "ShellCheck"
form = "jsonl"
fields = ["exit_code", "error_count", "first_error"]
error_event = "CheckFailed"
